name: Supervised content draft
on:
  workflow_dispatch:
    inputs:
      enable_generation: {description: 'Type ENABLE to request one draft', required: true, default: 'DISABLED'}
  schedule:
    - cron: '17 1 * * 2,5'
permissions: {contents: write, pull-requests: write}
jobs:
  draft:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.enable_generation == 'ENABLE') || (github.event_name == 'schedule' && vars.CONTENT_AGENT_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - name: Generate an unpublished draft
        env:
          CONTENT_AGENT_ENABLED: ${{ vars.CONTENT_AGENT_ENABLED }}
          MANUAL_ENABLE: ${{ inputs.enable_generation }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTENT_MODEL: ${{ secrets.CONTENT_MODEL }}
        run: node scripts/generate-content-draft.mjs
      - run: npm run validate:content
      - name: Enforce draft-only scope
        run: test -z "$(git diff --name-only | grep -v '^content/drafts/')"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: content-draft/${{ github.run_id }}
          title: 'Content draft: human review required'
          labels: content-draft,human-review-required
          add-paths: content/drafts/
          body: |
            ## Factual review checklist
            - [ ] Every claim checked against its linked authoritative source
            - [ ] No leaks, invented quotations, cast, dates, or social-only rumours
            - [ ] MCU and comics continuity distinguished
            - [ ] Originality, spoilers, links, metadata and label reviewed
            - [ ] Draft remains unpublished until a human approves it
