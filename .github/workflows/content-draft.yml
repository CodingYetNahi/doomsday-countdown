name: Supervised content draft
on:
  workflow_dispatch:
    inputs:
      enable_generation:
        description: 'Type ENABLE to run the disabled-by-default generation hook'
        required: true
        default: 'DISABLED'
  schedule:
    - cron: '17 1 * * 2,5' # 06:47 IST Tuesday and Friday
permissions:
  contents: write
  pull-requests: write
jobs:
  draft:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_generation == 'ENABLE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Stop safely without required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTENT_MODEL: ${{ secrets.CONTENT_MODEL }}
        run: |
          test -n "$OPENAI_API_KEY" && test -n "$CONTENT_MODEL" || { echo 'Required drafting secrets are unavailable; stopping safely.'; exit 1; }
      - name: Generation framework (paid API intentionally disabled)
        run: |
          echo 'The reviewed API invocation is intentionally disabled. Add a draft only after maintainers approve provider usage.'
          exit 1
      - run: npm run validate:content
      - name: Ensure draft-only changes
        run: test -z "$(git diff --name-only | grep -v '^content/drafts/')"
      - name: Create review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: content-draft/${{ github.run_id }}
          title: 'Content draft: human review required'
          labels: content-draft,human-review-required
          body: |
            ## Factual review checklist
            - [ ] Every factual claim checked against each linked authoritative source
            - [ ] No leak, invented quotation, cast member, date, or social-only rumour
            - [ ] MCU and comics continuity distinguished
            - [ ] Originality, spoiler label, links, frontmatter and human-readable SEO checked
            - [ ] Draft status removed only after approval
          add-paths: content/drafts/
